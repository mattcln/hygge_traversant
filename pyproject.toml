[project]
name = "hygge-traversant"
version = "0.1.0"
description = "Détecte les nouvelles annonces de location à Copenhague et prévient par ntfy."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hygge = "hygge_traversant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hygge_traversant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
